spring.main.web-application-type=NONE
# Defines a folder to write CSV files to. If it does not exist, it will be created.
nihmsetl.data.dir=/data/nihmsloader/data
# Allow 30 seconds for a request to be read before timing out
nihmsetl.http.read-timeout-ms=30000
# Allow 30 seconds for establishing connections before timing out
nihmsetl.http.connect-timeout-ms=30000
# Wait before the first retry of a failed or rate limited request. Doubled for each further retry.
nihmsetl.http.retry-wait-ms=5000

# Crossref REST API, used to find the publications acknowledging each NIH award held in PASS
nihmsetl.crossref.url=https://api.crossref.org
# Contact email address sent to Crossref with each request. Crossref applies its rate limits per address,
# so this should be a real address which is not shared with other tools. If blank, the slower public
# limits apply.
nihmsetl.crossref.mailto=${NIHMS_CROSSREF_MAILTO:}
# Wait after each Crossref request. Crossref allows 3 list requests a second when a mailto is given.
nihmsetl.crossref.request-interval-ms=400

# PMC ID Converter API, used to find the PMCID, PMID and NIHMSID of the publications found
nihmsetl.idconv.url=https://pmc.ncbi.nlm.nih.gov/tools/idconv/api/v1/articles/
nihmsetl.idconv.tool=pass-nihms-loader
nihmsetl.idconv.email=${NIHMS_CROSSREF_MAILTO:}
# Wait after each ID Converter request
nihmsetl.idconv.request-interval-ms=400

# Optional RSQL filter limiting the PASS Grants whose award numbers are searched for. Grants whose award
# number is not in the NIH format are always ignored. Blank considers all Grants.
nihmsetl.harvest.grant-filter=

pass.client.url=${PASS_CORE_URL}
pass.client.user=${PASS_CORE_USER}
pass.client.password=${PASS_CORE_PASSWORD}
